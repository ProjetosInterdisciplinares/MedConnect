services:
  - type: web
    name: medconnect-backend
    env: python
    region: oregon
    plan: free
    rootDir: Codigo/backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn app.wsgi --bind 0.0.0.0:$PORT --timeout 180"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      # Banco externo (Neon). O valor é definido só no painel do Render
      # (Environment), nunca aqui, pois contém a senha do banco.
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"
